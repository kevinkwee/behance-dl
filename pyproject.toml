[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "behance-dl"
dynamic = ["version"]
description = "Download the images of public Behance project galleries."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Elian Kevin", email = "19345886+kevinkwee@users.noreply.github.com" }]
keywords = ["behance", "downloader", "gallery", "cli", "portfolio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
video = ["yt-dlp>=2025.1.1"]

[project.scripts]
behance-dl = "behance_dl.cli:main"

[project.urls]
Homepage = "https://github.com/kevinkwee/behance-dl"
Repository = "https://github.com/kevinkwee/behance-dl"
Issues = "https://github.com/kevinkwee/behance-dl/issues"
Releases = "https://github.com/kevinkwee/behance-dl/releases"

[tool.hatch.version]
path = "src/behance_dl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/behance_dl"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET", "PTH", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["behance_dl", "conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PTH"]

[tool.coverage.run]
source = ["behance_dl"]
branch = true
