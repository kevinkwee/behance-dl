[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "behance-dl"
dynamic = ["version"]
description = "Download the images of public Behance project galleries."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Elian Kevin", email = "contact@kevinkwee.dev" }]
keywords = ["behance", "downloader", "gallery", "cli", "portfolio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
video = ["yt-dlp>=2025.1.1"]

[project.scripts]
behance-dl = "behance_dl.cli:main"

[project.urls]
Homepage = "https://github.com/kevinkwee/behance-dl"
Repository = "https://github.com/kevinkwee/behance-dl"
Issues = "https://github.com/kevinkwee/behance-dl/issues"
Changelog = "https://github.com/kevinkwee/behance-dl/blob/main/CHANGELOG.md"
Releases = "https://github.com/kevinkwee/behance-dl/releases"
Funding = "https://ko-fi.com/kevinkwee27"

[dependency-groups]
dev = ["mypy>=2.4", "pytest>=8", "pytest-cov>=5", "ruff>=0.17"]

[tool.hatch.version]
path = "src/behance_dl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/behance_dl"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
pydocstyle.convention = "google"
ignore = [
  "COM812", # conflicts with the formatter
  "CPY", # no per-file copyright notices. LICENSE covers the package.
  "D10", # docstrings stay optional, written where they add information
  "EM101", # a short fixed message reads better inline at the raise site
  "EM102", # assigning the message to a local only moves the same formatting one line away
  "PLR0913", # download_images and the test plan builder stay explicit without a config object
  "T201", # the project reports through stdout and stderr, not a logging framework
  "TRY003", # the project raises a few broad error types and puts the detail in each message
]

[tool.ruff.lint.pylint]
max-returns = 7 # suffix_from_head returns as soon as it recognises a file format

[tool.ruff.lint.isort]
known-first-party = ["behance_dl", "conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "ARG", # fakes accept the signatures they stand in for
  "FBT001", # parametrized tests and fakes take boolean parameters
  "FBT002", # fakes copy external signatures that default a boolean flag
  "PLR2004", # tests compare against the concrete values they assert
  "S101", # asserting is a test's job
]

# Release scripts run as standalone files, not as an importable package.
".github/scripts/*" = ["INP001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["behance_dl"]
branch = true

[tool.mypy]
python_version = "3.12"
strict = true
enable_error_code = ["ignore-without-code"]
files = ["src", "tests", ".github/scripts"]

[[tool.mypy.overrides]]
# yt-dlp is an optional extra, and the import is guarded at runtime.
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true
