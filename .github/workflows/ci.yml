name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the locked environment
        run: uv sync --locked
      - name: Run the tests
        run: uv run pytest --cov=behance_dl --cov-report=term-missing

  lint:
    name: Lint, format, and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - name: Install the locked environment
        run: uv sync --locked
      - name: Check lint rules
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Check the types
        run: uv run mypy
      - name: Check that the package builds
        run: uv build
