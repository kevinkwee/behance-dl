name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - name: Build the wheel and sdist
        run: uv build
      - name: Store the distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/behance-dl
    permissions:
      id-token: write
    steps:
      - name: Fetch the distribution
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Create the GitHub release
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build the notes from the changelog
        run: python .github/scripts/release_notes.py "$GITHUB_REF_NAME" > release-notes.md
      - name: Fetch the published files
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag dist/*
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag dist/*
          fi
